################
### MONITORS ###
################

monitor=,2560x1440@165,auto,auto

###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = dolphin
$launcher= wofi --show drun
$emojiMenu = wofi-emoji

#################
### AUTOSTART ###
#################

exec = hyprpaper -c ~/.config/hypr/hyprpaper.conf
exec = ~/.config/hypr/scripts/eww.sh

layerrule = blur,eww

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 15
    gaps_out = 30
    border_size = 2
    col.active_border = rgb(7dcfff) rgb(7aa2f7) 45deg
    col.inactive_border = rgb(7dcfff) rgb(7aa2f7) 45deg
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 18
    active_opacity = 1.0
    inactive_opacity = 0.60

    blur {
        enabled = true
        size = 5
        passes = 5
        vibrancy = 5
    }

    shadow {
        enabled = true
        range = 20
        color = 0x607dcfff
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.3, 0.1, 1.05

    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 4, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

#############
### INPUT ###
#############

input {
    kb_layout = fr
    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0

    repeat_delay = 250
    repeat_rate = 75

    touchpad {
        natural_scroll = false
    }
}

gestures {
    workspace_swipe = true
}

###################
### KEYBINDINGS ###
###################

$super = SUPER # Sets "Windows" key as main modifier

bind = $super, return, fullscreen,
windowrulev2 = suppressevent maximize, class:.* # cancel window maximization

bind = $super, F, exec, $terminal
bind = $super, Q, killactive,
bind = $super, E, exec, $fileManager
bind = $super, V, togglefloating,
bind = $super, D, exec, $launcher
bind = $super, semicolon, exec, $emojiMenu
bind = $super, P, pseudo, # dwindle
bind = $super, O, togglesplit, # dwindle

# Move focus with super + hjkl
bind = $super, H, movefocus, l
bind = $super, L, movefocus, r
bind = $super, K, movefocus, u
bind = $super, J, movefocus, d

# Move active window with super + hjkl
bind = $super SHIFT, H, movewindow, l
bind = $super SHIFT, L, movewindow, r
bind = $super SHIFT, K, movewindow, u
bind = $super SHIFT, J, movewindow, d

# Switch workspaces with super + [0-9]
bind = $super, ampersand, workspace, 1
bind = $super, eacute, workspace, 2
bind = $super, quotedbl, workspace, 3
bind = $super, apostrophe, workspace, 4
bind = $super, parenleft, workspace, 5
bind = $super, egrave, workspace, 6
bind = $super, minus, workspace, 7
bind = $super, underscore, workspace, 8
bind = $super, ccedilla, workspace, 9
bind = $super, agrave, workspace, 10

# Move active window to a workspace with super + SHIFT + [0-9]
bind = $super SHIFT, ampersand, movetoworkspace, 1
bind = $super SHIFT, eacute, movetoworkspace, 2
bind = $super SHIFT, quotedbl, movetoworkspace, 3
bind = $super SHIFT, apostrophe, movetoworkspace, 4
bind = $super SHIFT, parenleft, movetoworkspace, 5
bind = $super SHIFT, egrave, movetoworkspace, 6
bind = $super SHIFT, minus, movetoworkspace, 7
bind = $super SHIFT, underscore, movetoworkspace, 8
bind = $super SHIFT, ccedilla, movetoworkspace, 9
bind = $super SHIFT, agrave, movetoworkspace, 10

# Reload config
bind = $super, R, exec, hyprctl reload

# Screenshot a region
bind = , PRINT, exec, hyprshot -m region --clipboard-only

# Move/resize windows with super + LMB/RMB and dragging
bindm = $super, mouse:272, movewindow
bindm = $super, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
