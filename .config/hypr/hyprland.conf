monitor=,preferred,auto,1

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyprctl setcursor Notwaita-Black 28
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Flat-Remix-Dark"
exec-once = hyprpaper -c ~/.config/hypr/hyprpaper.conf
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = ags run

env = HYPRCURSOR_THEME,Notwaita-Black
env = HYPRCURSOR_SIZE,28

# disable borders when there's only one window on screen
windowrule = border_size 0, match:float 0, match:workspace w[tv1]s[false]

workspace=1, persistent:true
workspace=2, persistent:true
workspace=3, persistent:true
workspace=4, persistent:true

general {
    gaps_in = 10
    gaps_out = 25,25,0,25 # Gap bottom is set to 0 because the bar corners already provide sufficient spacing
    border_size = 2
    col.active_border = 0xfff0b97a
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 18
    shadow {
        enabled = true
        range = 25
        color = 0x15141415
    }
}

animations {
    enabled = true
    bezier = overshot, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 6, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 4, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 3, overshot, slidefadevert 20%
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

input {
    kb_layout = fr
    follow_mouse = 1
    sensitivity = 0
    repeat_delay = 275
    repeat_rate = 50
}

# ------ KEYBINDS --------------------------------------------------------------------------

$super = SUPER

$terminal = kitty
$fileManager = nautilus
$launcher = wofi --show drun
$emojiPicker = wofi-emoji

bind = $super, T, exec, $terminal
bind = $super, E, exec, $fileManager
bind = $super, space, exec, $launcher
bind = $super, semicolon, exec, $emojiPicker

bind = $super, esc, exec, hyprlock

bind = $super, Q, killactive,
bind = $super, F, fullscreen,
bind = $super, V, togglefloating,
bind = $super, P, pseudo,
bind = $super, O, togglesplit,

# Move focus with super + hjkl
bind = $super, H, movefocus, l
bind = $super, L, movefocus, r
bind = $super, K, movefocus, u
bind = $super, J, movefocus, d

# Move active window with super + shift + hjkl
bind = $super SHIFT, H, movewindow, l
bind = $super SHIFT, L, movewindow, r
bind = $super SHIFT, K, movewindow, u
bind = $super SHIFT, J, movewindow, d

# Switch workspaces with super + [0-9] (this remap is for AZERTY keyboard)
bind = $super, ampersand, workspace, 1
bind = $super, eacute, workspace, 2
bind = $super, quotedbl, workspace, 3
bind = $super, apostrophe, workspace, 4
bind = $super, parenleft, workspace, 5
bind = $super, egrave, workspace, 6
bind = $super, minus, workspace, 7
bind = $super, underscore, workspace, 8
bind = $super, ccedilla, workspace, 9

# Move active window to a workspace with super + SHIFT + [0-9]
bind = $super SHIFT, ampersand, movetoworkspace, 1
bind = $super SHIFT, eacute, movetoworkspace, 2
bind = $super SHIFT, quotedbl, movetoworkspace, 3
bind = $super SHIFT, apostrophe, movetoworkspace, 4
bind = $super SHIFT, parenleft, movetoworkspace, 5
bind = $super SHIFT, egrave, movetoworkspace, 6
bind = $super SHIFT, minus, movetoworkspace, 7
bind = $super SHIFT, underscore, movetoworkspace, 8
bind = $super SHIFT, ccedilla, movetoworkspace, 9

# Reload config
bind = $super, R, exec, hyprctl reload

# Screenshot a region
bind = , PRINT, exec, hyprshot -m region --clipboard-only

# Move/resize windows with super + LMB/RMB and dragging
bindm = $super, mouse:272, movewindow
bindm = $super, mouse:273, resizewindow

# Multimedia keys for volume, LCD brightness and media player
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
