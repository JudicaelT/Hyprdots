monitor =,highrr,auto,auto

$terminal = kitty
$fileManager = nautilus
$launcher = wofi --show drun
$emojiMenu = wofi-emoji

exec = hyprpaper -c ~/.config/hypr/hyprpaper.conf
exec = ags run

env = XCURSOR_THEME,NotwaitaBlack
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,NotwaitaBlack
env = HYPRCURSOR_SIZE,24

# Cancel window maximization
windowrule = suppressevent maximize, class:.*
# Activate borders only if there are more than one window on screen
windowrulev2 = noborder, onworkspace:w[t1]

workspace=1, persistent:true
workspace=2, persistent:true
workspace=3, persistent:true
workspace=4, persistent:true

general {
    gaps_in = 15
    gaps_out = 30,30,30,0 # gap left is set to 0 because there is already a gap with the bar corners
    border_size = 2
    col.active_border = 0xffd99e68
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

layerrule = blur ,gtk-layer-shell
layerrule = ignorezero ,gtk-layer-shell

decoration {
    rounding = 18
    blur {
        enabled = true
        new_optimizations = on
        size = 5
        passes = 5
        vibrancy = 5
    }
    shadow {
        enabled = true
        range = 20
        color = 0x70141415
    }
}

animations {
    enabled = true
    animation = windows, 1, 6, default, slide
    animation = windowsOut, 1, 6, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 4, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

input {
    kb_layout = fr
    follow_mouse = 1
    sensitivity = 0
    repeat_delay = 275
    repeat_rate = 50
    touchpad {
        natural_scroll = false
    }
}

gestures {
    workspace_swipe = true
}

###################
### KEYBINDINGS ###
###################

$super = SUPER

bind = $super, return, fullscreen,

bind = $super, F, exec, $terminal
bind = $super, Q, killactive,
bind = $super, E, exec, $fileManager
bind = $super, V, togglefloating,
bind = $super, space, exec, $launcher

bind = $super, semicolon, exec, $emojiMenu
bind = $super, P, pseudo,
bind = $super, O, togglesplit,

# Move focus with super + hjkl
bind = $super, H, movefocus, l
bind = $super, L, movefocus, r
bind = $super, K, movefocus, u
bind = $super, J, movefocus, d

# Move active window with super + shift + hjkl
bind = $super SHIFT, H, movewindow, l
bind = $super SHIFT, L, movewindow, r
bind = $super SHIFT, K, movewindow, u
bind = $super SHIFT, J, movewindow, d

# Switch workspaces with super + [0-9] (this remap is for azerty keyboard)
bind = $super, ampersand, workspace, 1
bind = $super, eacute, workspace, 2
bind = $super, quotedbl, workspace, 3
bind = $super, apostrophe, workspace, 4
bind = $super, parenleft, workspace, 5
bind = $super, egrave, workspace, 6
bind = $super, minus, workspace, 7
bind = $super, underscore, workspace, 8
bind = $super, ccedilla, workspace, 9

# Move active window to a workspace with super + SHIFT + [0-9]
bind = $super SHIFT, ampersand, movetoworkspace, 1
bind = $super SHIFT, eacute, movetoworkspace, 2
bind = $super SHIFT, quotedbl, movetoworkspace, 3
bind = $super SHIFT, apostrophe, movetoworkspace, 4
bind = $super SHIFT, parenleft, movetoworkspace, 5
bind = $super SHIFT, egrave, movetoworkspace, 6
bind = $super SHIFT, minus, movetoworkspace, 7
bind = $super SHIFT, underscore, movetoworkspace, 8
bind = $super SHIFT, ccedilla, movetoworkspace, 9

# Reload config
bind = $super, R, exec, hyprctl reload

# Screenshot a region
bind = , PRINT, exec, hyprshot -m region --clipboard-only

# Move/resize windows with super + LMB/RMB and dragging
bindm = $super, mouse:272, movewindow
bindm = $super, mouse:273, resizewindow

# Multimedia keys for volume, LCD brightness and media player
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
