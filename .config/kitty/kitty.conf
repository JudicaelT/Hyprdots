# ----- [General] -----------------------------------------

enable_audio_bell no
cursor_trail 1
mouse_hide_wait 1.0
resize_debounce_time 0.3
wayland_titlebar_color system
linux_display_server auto

# ----- [Links] -------------------------------------------

url_style curly
url_prefixes http https
detect_urls yes

# ----- [Fonts] -------------------------------------------

font_family         JetbrainsMono Nerd Font
font_size           10
disable_ligatures   never

# ----- [Tabs] --------------------------------------------

tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style round 

# ----- [Colors] ------------------------------------------

foreground #dddddd
background #202020
selection_foreground #000000
selection_background #fffacd
url_color #0087bd

tab_bar_background      none
active_tab_foreground   #dddddd
active_tab_background   #5b5d73
active_tab_font_style   bold-italic
inactive_tab_foreground #666666
inactive_tab_background #323245
inactive_tab_font_style normal

color0  #2E2D2A
color1  #ef5e76
color2  #98c87a
color3  #f2a45c
color4  #81a8cc
color5  #d1a7c9
color6  #9ec8d0
color7  #d5d5d5
color8  #767696
color9  #dd7474
color10 #a5e0da
color11 #f5c37d
color12 #90aaf0
color13 #bebee6
color14 #cfcff0
color15 #ffffff

# ----- [Software] ----------------------------------------

shell .
editor nvim
term xterm-kitty

# ----- [Keymaps] -----------------------------------------

kitty_mod ctrl+shift

map ctrl+backspace      send_text all \x17

map ctrl+shift+c         copy_to_clipboard
map ctrl+shift+v         paste_from_clipboard
map ctrl+shift+s         paste_from_selection

map ctrl+shift+k         scroll_line_up
map ctrl+shift+j         scroll_line_down
map ctrl+shift+h         scroll_page_up
map ctrl+shift+l         scroll_page_down
map ctrl+shift+home      scroll_home
map ctrl+shift+end       scroll_end

map ctrl+shift+equal     change_font_size all +1.0
map ctrl+shift+minus     change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

map ctrl+shift+f5        load_config_file
map ctrl+shift+f6        debug_config

map ctrl+alt+&       goto_tab 1
map ctrl+alt+é       goto_tab 2
map ctrl+alt+"       goto_tab 3
map ctrl+alt+'       goto_tab 4
map ctrl+alt+(       goto_tab 5
map ctrl+alt+-       goto_tab 6
map ctrl+alt+è       goto_tab 7
map ctrl+alt+_       goto_tab 8
map ctrl+alt+ç       goto_tab 9
map ctrl+shift+t     new_tab
map ctrl+shift+q     close_tab
map ctrl+shift+alt+t set_tab_title
map ctrl+shift+alt+h move_tab_backward
map ctrl+shift+alt+j move_tab_forward 
map ctrl+shift+alt+k move_tab_backward
map ctrl+shift+alt+l move_tab_forward
